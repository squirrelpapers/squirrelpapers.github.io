# Third-party files, copied unchanged (PRIMER A3). Used by the citation step
# (S6) to render citations in the reader's browser; nothing is loaded from a
# CDN at run time.

citeproc:
  name: citeproc-js
  version: 2.4.63
  source: https://www.npmjs.com/package/citeproc
  files: [citeproc/citeproc_commonjs.js, citeproc/LICENSE]
  licence: CPAL-1.0 OR AGPL-1.0 (see citeproc/LICENSE)
  taken: 2026-10-07

csl_styles:
  repository: https://github.com/citation-style-language/styles
  commit: 0151fd1ed467ec54f4f2554d68fce9ccc6ff0118
  licence: CC BY-SA 3.0 (https://creativecommons.org/licenses/by-sa/3.0/)
  files:
    apa.csl: APA 7th edition
    chicago-author-date.csl: Chicago Manual of Style (author-date)
    harvard-cite-them-right.csl: Harvard (Cite Them Right)
    ieee.csl: IEEE
    modern-language-association.csl: MLA 9th edition
    nlm-citation-sequence.csl: Vancouver (the independent parent of dependent/vancouver-nlm.csl)
  taken: 2026-10-07

csl_locales:
  repository: https://github.com/citation-style-language/locales
  commit: a89adece41013402236e2c9020972d7e931fbab8
  licence: CC BY-SA 3.0 (https://creativecommons.org/licenses/by-sa/3.0/)
  files: [locales-en-GB.xml, locales-en-US.xml, locales-de-DE.xml]
  taken: 2026-10-07

pdfjs:
  name: pdf.js (pdfjs-dist)
  version: 6.4.299
  source: https://www.npmjs.com/package/pdfjs-dist
  files: [pdfjs/pdf.min.mjs, pdfjs/pdf.worker.min.mjs, pdfjs/standard_fonts/, pdfjs/LICENSE]
  build: legacy/build/ of the package - the modern build needs Map.getOrInsertComputed,
    which current Chromium and Firefox releases do not have yet (S8b)
  licence: Apache-2.0 (see pdfjs/LICENSE)
  note: Renders the PDF preview on entry pages (S8b); Zenodo does not allow its
    preview page inside a frame on another site.
  taken: 2026-10-07
pyodide:
  name: Pyodide (npm package pyodide) with rdflib and pyparsing wheels
  version: 314.0.7 (Python 3.14.2); rdflib 7.6.0; pyparsing 3.3.2
  source: https://www.npmjs.com/package/pyodide, https://pypi.org/project/rdflib/,
    https://pypi.org/project/pyparsing/
  files: [pyodide/pyodide.mjs, pyodide/pyodide.asm.mjs, pyodide/pyodide.asm.wasm,
    pyodide/python_stdlib.zip, pyodide/pyodide-lock.json, pyodide/LICENSE,
    pyodide/rdflib-7.6.0-py3-none-any.whl, pyodide/pyparsing-3.3.2-py3-none-any.whl]
  licence: MPL-2.0 (Pyodide, see pyodide/LICENSE); BSD-3-Clause (rdflib) and MIT
    (pyparsing), each inside its wheel (*.dist-info)
  note: Runs the SPARQL page (S9) in the browser. Only the core runtime is taken
    from the package; the two pure-Python wheels are unpacked by the page itself,
    so neither micropip nor the Pyodide CDN is ever contacted. When updating,
    keep rdflib equal to the version the build checks with (requirements.txt).
  taken: 2026-10-07
leaflet:
  name: Leaflet
  version: 1.9.4
  source: https://www.npmjs.com/package/leaflet
  files: [leaflet/leaflet.js, leaflet/leaflet.css, leaflet/images/, leaflet/LICENSE]
  licence: BSD-2-Clause (see leaflet/LICENSE)
  note: Draws the map of event places (S10).
  taken: 2026-10-07
naturalearth:
  name: Natural Earth 1:50m admin-0 countries, simplified
  version: natural-earth-vector master ca96624 (VERSION 5.2.0-pre)
  source: https://github.com/nvkelso/natural-earth-vector/blob/master/geojson/ne_50m_admin_0_countries.geojson
  files: [naturalearth/countries.js]
  licence: public domain (https://www.naturalearthdata.com/about/terms-of-use/)
  note: Background of the map, so it needs no tile server. Made by
    py/tools/make_basemap.py (simplified 0.02 degrees, rounded to 0.01 degrees,
    attributes dropped; 3 MB -> 0.76 MB).
  taken: 2026-10-07
