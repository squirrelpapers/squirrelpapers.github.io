# S11 - the build as a gate.
#
# docs/ and dist/ are committed (PRIMER A4): what GitHub Pages serves is what
# was built and looked at locally. This workflow rebuilds everything from the
# sources with the locked versions and fails when
#   - any step fails under --strict (SHACL gate, example queries, map
#     acceptance, link check, ...), or
#   - the rebuild differs from the commit, i.e. docs/ or dist/ were not
#     regenerated after a change to content/, py/ or assets/.
# It deploys nothing; Pages keeps serving docs/ from the main branch.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install the locked versions
        run: pip install -r requirements-lock.txt

      - name: Build everything from scratch
        # --fresh: no step cache exists here anyway; stated for the reader.
        run: python main.py --strict --fresh

      - name: Rebuild must equal the commit
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "::error::docs/ or dist/ do not match the sources. Run 'python main.py' locally (with requirements-lock.txt) and commit the result."
            echo "$changes" | head -50
            git diff --stat | tail -5
            exit 1
          fi
          echo "docs/ and dist/ match a fresh build."

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            dist/pipeline_report.txt
            dist/reports/
          if-no-files-found: ignore
