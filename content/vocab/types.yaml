# Entry types of the Squirrel Papers - a small SKOS concept scheme (PRIMER A4).
#
# Every `types:` slug in content/vol<N>.yaml must be a `slug` or an `alias`
# here; S4 fails under --strict otherwise. The first type of an entry is its
# primary type.
#
# Concept IRI:  https://w3id.org/squirrelpapers/type/<slug>
# Mappings (S7 turns them into skos:exactMatch / skos:closeMatch):
#   coar    COAR Resource Types 3.x, http://purl.org/coar/resource_type/<code>
#   fabio   FaBiO class, http://purl.org/spar/fabio/<Class>
#   zenodo  resource_type of a Zenodo record, "type" or "type/subtype";
#           used by S4 to type entries that carry no type in content/.
# `match: close` marks a mapping that is only approximate.
#
# The COAR codes were written from knowledge of the vocabulary, not checked
# against a downloaded copy; S8 is the place to verify them (PRIMER Teil D).

scheme:
  title: {en: Squirrel Papers entry types, de: Eintragstypen der Squirrel Papers}

concepts:
- slug: presentation
  label: {en: Presentation, de: Vortrag}
  aliases: [talk]
  coar: R60J-J5BD
  fabio: Presentation
  zenodo: [presentation]
- slug: poster
  label: {en: Poster, de: Poster}
  coar: c_6670
  fabio: ConferencePoster
  zenodo: [poster]
- slug: conference-paper
  label: {en: Conference paper, de: Konferenzbeitrag}
  coar: c_5794
  fabio: ConferencePaper
  zenodo: [publication/conferencepaper]
- slug: conference-proceeding
  label: {en: Proceedings paper, de: Beitrag in Tagungsband}
  coar: c_5794
  fabio: ProceedingsPaper
  zenodo: [publication/conferenceproceeding]
  match: close
- slug: conference-session
