languages: [en, de]
description:
  en: >-
    The Squirrel Papers by the Research Squirrel Engineers Network are a free
    Open Access journal hosting publications on Zenodo and the Open Science
    Framework (OSF), collecting Linked Open Data (LOD), Research Software
    Engineering (RSE), Cultural Heritage and Geo-Sciences related research
    papers, working papers, blog posts, posters, slides, research data and
    research software.
  de: >-
    Die Squirrel Papers des Research Squirrel Engineers Network sind ein
    kostenfreies Open-Access-Journal mit Publikationen auf Zenodo und dem Open
    Science Framework (OSF). Sie sammeln Forschungsarbeiten, Working Papers,
    Blogbeiträge, Poster, Folien, Forschungsdaten und Forschungssoftware aus
    den Bereichen Linked Open Data (LOD), Research Software Engineering (RSE),
    Kulturerbe und Geowissenschaften.
registration:
  en: >-
    The Squirrel Papers are an official journal accepted by the
    "Nationales ISSN-Zentrum für Deutschland" with ISSN 2750-560X.
  de: >-
    Die Squirrel Papers sind ein offiziell vom Nationalen ISSN-Zentrum für
    Deutschland anerkanntes Journal mit der ISSN 2750-560X.

