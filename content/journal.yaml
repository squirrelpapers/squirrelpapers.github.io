publisher: Research Squirrel Engineers Network
editor:
  name: Thiery, Florian
  orcid: 0000-0002-3246-3531
  role: {en: Editor / Head Squirrel, de: Herausgeber / Head Squirrel}
contact: mail [at] squirrelpapers [dot] net
licence:
  content: https://creativecommons.org/licenses/by/4.0/
